<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LENTO — Próximamente</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #82aedd;
    }

    :root {
      --stretch-delay: 0.5s;
      --stretch-duration: 2.8s;
    }

    /* ── Animated mesh gradient ── */
    .mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #82aedd;
      overflow: hidden;
    }

    .mesh__blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      will-change: transform;
    }

    .mesh__blob--blue {
      width: 80vmax;
      height: 80vmax;
      background: #6a96c8;
      top: -30%;
      left: -20%;
      opacity: 0.55;
      animation: drift-a 11s ease-in-out infinite alternate;
    }

    .mesh__blob--blue2 {
      width: 75vmax;
      height: 75vmax;
      background: #82aedd;
      bottom: -30%;
      right: -25%;
      animation: drift-b 13s ease-in-out infinite alternate;
    }

    .mesh__blob--light {
      width: 28vmax;
      height: 28vmax;
      background: #cfebff;
      top: 20%;
      right: 15%;
      opacity: 0.55;
      animation: drift-c 10s ease-in-out infinite alternate;
    }

    .mesh__blob--light2 {
      width: 20vmax;
      height: 20vmax;
      background: #cfebff;
      top: 55%;
      left: 8%;
      opacity: 0.45;
      animation: drift-light2 9s ease-in-out infinite alternate;
    }

    .mesh__blob--light3 {
      width: 18vmax;
      height: 18vmax;
      background: #cfebff;
      bottom: 18%;
      right: 28%;
      opacity: 0.4;
      animation: drift-light3 11s ease-in-out infinite alternate;
    }

    .mesh__blob--red {
      width: 22vmax;
      height: 22vmax;
      background: #e30d25;
      bottom: 8%;
      left: 12%;
      opacity: 0.5;
      animation: drift-red 12s ease-in-out infinite alternate;
    }

    .mesh__blob--red2 {
      width: 16vmax;
      height: 16vmax;
      background: #e30d25;
      top: 12%;
      left: 38%;
      opacity: 0.38;
      animation: drift-red2 8s ease-in-out infinite alternate;
    }

    .mesh__blob--red3 {
      width: 14vmax;
      height: 14vmax;
      background: #e30d25;
      top: 62%;
      right: 6%;
      opacity: 0.35;
      animation: drift-red3 10s ease-in-out infinite alternate;
    }

    @keyframes drift-a {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(12vw, 8vh) scale(1.12); }
    }

    @keyframes drift-b {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-10vw, -6vh) scale(1.08); }
    }

    @keyframes drift-c {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-8vw, 10vh) scale(1.15); }
    }

    @keyframes drift-red {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      100% { transform: translate(12vw, -10vh) rotate(6deg) scale(1.12); }
    }

    @keyframes drift-light2 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(10vw, -8vh) scale(1.18); }
    }

    @keyframes drift-light3 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-9vw, 7vh) scale(1.14); }
    }

    @keyframes drift-red2 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-11vw, 9vh) scale(1.2); }
    }

    @keyframes drift-red3 {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      100% { transform: translate(8vw, -12vh) rotate(-8deg) scale(1.15); }
    }

    /* Film grain overlay */
    .mesh__grain {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      opacity: 0.045;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grain 0.5s steps(2) infinite;
    }

    @keyframes grain {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(-2%, -2%); }
    }

    /* ── Content ── */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 2rem;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }

    .logo {
      width: min(88vw, 720px);
      height: auto;
      opacity: 0;
      animation: logo-in 0.6s ease-out 0.2s forwards;
    }

    .tagline {
      font-size: clamp(0.85rem, 2.5vw, 1.05rem);
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.88);
      opacity: 0;
      transform: translateY(8px);
      animation: tagline-in 0.7s ease-out calc(var(--stretch-delay) + var(--stretch-duration)) forwards;
    }

    @keyframes tagline-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes logo-in {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* E stretch animation */
    .e-bars {
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(1);
      animation: stretch-e var(--stretch-duration) cubic-bezier(0.22, 1, 0.36, 1) var(--stretch-delay) forwards;
    }

    .nto-group {
      animation: slide-nto var(--stretch-duration) cubic-bezier(0.22, 1, 0.36, 1) var(--stretch-delay) forwards;
    }

    @keyframes stretch-e {
      from { transform: scaleX(1); }
      to   { transform: scaleX(10.35); }
    }

    @keyframes slide-nto {
      from { transform: translateX(0); }
      to   { transform: translateX(344px); }
    }
  </style>
</head>
<body>
  <div class="mesh" aria-hidden="true">
    <div class="mesh__blob mesh__blob--blue"></div>
    <div class="mesh__blob mesh__blob--blue2"></div>
    <div class="mesh__blob mesh__blob--light"></div>
    <div class="mesh__blob mesh__blob--light2"></div>
    <div class="mesh__blob mesh__blob--light3"></div>
    <div class="mesh__blob mesh__blob--red"></div>
    <div class="mesh__blob mesh__blob--red2"></div>
    <div class="mesh__blob mesh__blob--red3"></div>
    <div class="mesh__grain"></div>
  </div>

  <main class="content">
    <div class="hero">
      <svg
      class="logo"
      viewBox="0 0 900 150"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="LENTO"
    >
      <g fill="#e30d25">
        <!-- L -->
        <path d="M0 8 H44 V118 H110 V150 H0 Z" />
        <!-- E  -->
        <!-- stem -->
        <rect x="88" y="8" width="44" height="142" />
        <!-- bars -->
        <g class="e-bars">
          <rect x="132" y="8" width="34" height="36" />
          <rect x="132" y="62" width="34" height="36" />
          <rect x="132" y="114" width="38" height="36" />
        </g>
        <!-- N T O -->
        <g class="nto-group">
          <!-- N  -->
          <path d="M 160 150 L 160 8 L 215 8 L 235 73 L 235 8 L 290 8 L 290 150 L 235 150 L 215 87 L 215 150 Z" />
          <!-- T -->
          <path d="M260 8 H450 L413 42 V47 H364 V150 H317 V47 H260 Z " />
          <!-- O -->
          <path fill-rule="evenodd" clip-rule="evenodd" d="M450 8 A 71 71 0 1 1 449.99 8 M450 105 A 25 25 0 1 0 449.99 105 Z"/>
        </g>
      </g>
    </svg>
      <p class="tagline">Coming soon...</p>
    </div>
  </main>
</body>
</html>
